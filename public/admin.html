<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin - Accounts</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;margin:24px;background:#071226;color:#e6eef8}
    .card{background:#0f1f33;padding:16px;border-radius:8px;margin-bottom:12px}
    textarea{width:100%;height:160px;background:#071226;color:#e6eef8;border:1px solid #234}
    table{width:100%;border-collapse:collapse}
    td,th{border:1px solid #203; padding:6px}
    button{padding:8px 12px;background:#2b8; border:none;color:#022; border-radius:6px;cursor:pointer}
  </style>
</head>
<body>
  <h1>Admin Console</h1>

  <div class="card" id="loginCard">
    <h3>Login</h3>
    <p>Enter admin credentials used for Basic Auth.</p>
    <label>Username: <input id="admUser" /></label>
    <label style="margin-left:12px">Password: <input id="admPass" type="password" /></label>
    <div style="margin-top:8px"><button id="btnLogin">Set Credentials</button></div>
    <p id="loginMsg"></p>
  </div>

  <div class="card" id="controls" style="display:none;">
    <button id="btnLoad">Load Accounts</button>
    <button id="btnReload">Reload</button>
    <button id="btnBulk">Apply Bulk Update</button>
  </div>

  <div class="card" id="accountsCard" style="display:none;">
    <h3>Accounts</h3>
    <div id="accountsList">No data</div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;z-index:999;">
    <div style="background:#071226;padding:16px;border-radius:8px;max-width:900px;margin:auto;">
      <h3>Edit Account</h3>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:260px">
          <label>Username<br><input id="modal_username" disabled style="width:100%"/></label>
          <label>Email<br><input id="modal_email" style="width:100%"/></label>
          <label>Current Chapter<br><input id="modal_currentChapter" type="number" min="1" style="width:100%"/></label>
        </div>
        <div style="flex:1;min-width:260px">
          <label>Gold<br><input id="modal_gold" type="number" style="width:100%"/></label>
          <label>Chapter Currency (JSON)<br><textarea id="modal_currency" style="width:100%;height:120px"></textarea></label>
        </div>
      </div>
      <div style="margin-top:8px">
        <button id="modalSave">Save</button>
        <button id="modalClose" style="background:#f66;color:#fff;margin-left:8px">Close</button>
        <span id="modalMsg" style="margin-left:12px;color:#9f9"></span>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Edit Single Account</h3>
    <p>Enter username to fetch and JSON to apply as partial update.</p>
    <input id="editUser" placeholder="username" />
    <div style="margin-top:8px"><textarea id="editJson">{
  "currentChapter": 2
}</textarea></div>
    <div style="margin-top:8px"><button id="btnUpdate">Update Account</button><span id="updateMsg" style="margin-left:12px;color:#9f9"></span></div>
  </div>

  <div class="card">
    <h3>Bulk Update</h3>
    <p>Provide JSON array of operations: [{"filter":{...}, "update":{"$set":{...}}}, ...]</p>
    <textarea id="bulkJson">[ { "filter": { }, "update": { "$set": { } } } ]</textarea>
    <div style="margin-top:8px"><button id="btnApplyBulk">Send Bulk</button><span id="bulkMsg" style="margin-left:12px;color:#9f9"></span></div>
  </div>

  <script>
    let authHeader = null;
    const setMsg = (id, txt) => document.getElementById(id).textContent = txt;

    document.getElementById('btnLogin').addEventListener('click', () => {
      const u = document.getElementById('admUser').value;
      const p = document.getElementById('admPass').value;
      if (!u || !p) { setMsg('loginMsg','Enter username & password'); return; }
      authHeader = 'Basic ' + btoa(u + ':' + p);
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('controls').style.display = '';
      document.getElementById('accountsCard').style.display = '';
      setMsg('loginMsg','');
    });

    async function apiFetch(path, opts = {}){
      opts.headers = opts.headers || {};
      if (authHeader) opts.headers['Authorization'] = authHeader;
      const res = await fetch(path, opts);
      if (res.status === 401) throw new Error('Unauthorized');
      return res;
    }

    document.getElementById('btnLoad').addEventListener('click', async () => {
      try {
        const res = await apiFetch('/api/admin/accounts');
        const data = await res.json();
        renderAccountsTable(data);
      } catch (e) {
        document.getElementById('accountsList').innerHTML = '<div style="color:#f99">Load failed: '+e.message+'</div>';
      }
    });

    document.getElementById('btnReload').addEventListener('click', () => location.reload());

    document.getElementById('btnUpdate').addEventListener('click', async () => {
      const username = document.getElementById('editUser').value;
      let updates = {};
      try { updates = JSON.parse(document.getElementById('editJson').value); } catch (e) { setMsg('updateMsg','Invalid JSON'); return; }
      try {
        const res = await apiFetch('/api/admin/update-account', { method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ username, updates }) });
        const data = await res.json();
        setMsg('updateMsg','OK: ' + JSON.stringify(data));
      } catch (e) {
        setMsg('updateMsg','Error: '+e.message);
      }
    });

    document.getElementById('btnApplyBulk').addEventListener('click', async () => {
      let ops = [];
      try { ops = JSON.parse(document.getElementById('bulkJson').value); } catch (e) { setMsg('bulkMsg','Invalid JSON'); return; }
      try {
        const res = await apiFetch('/api/admin/bulk-update', { method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ operations: ops }) });
        const data = await res.json();
        setMsg('bulkMsg','OK: ' + JSON.stringify(data));
      } catch (e) {
        setMsg('bulkMsg','Error: '+e.message);
      }
    });

    // Render accounts as table with edit buttons
    function renderAccountsTable(accounts) {
      if (!Array.isArray(accounts)) {
        document.getElementById('accountsList').innerHTML = '<div>No accounts</div>';
        return;
      }
      const tbl = document.createElement('table');
      const thead = document.createElement('thead');
      thead.innerHTML = '<tr><th>Username</th><th>Email</th><th>Current Ch</th><th>Preview Inventory</th><th>Actions</th></tr>';
      tbl.appendChild(thead);
      const tbody = document.createElement('tbody');

      accounts.forEach(acc => {
        const tr = document.createElement('tr');
        const username = acc.username || '';
        const email = acc.email || '';
        const currentChapter = acc.currentChapter || '';
        // preview first chapter inventory
        let invPreview = '';
        try { invPreview = JSON.stringify(acc.chapters || {}).slice(0,120); } catch(e){ invPreview = '' }

        tr.innerHTML = `<td>${username}</td><td>${email}</td><td>${currentChapter}</td><td><pre style="white-space:pre-wrap;max-height:80px;overflow:auto">${invPreview}</pre></td><td></td>`;
        const actionTd = tr.querySelector('td:last-child');
        const btn = document.createElement('button');
        btn.textContent = 'Edit';
        btn.addEventListener('click', () => openEditModal(acc));
        actionTd.appendChild(btn);
        tbody.appendChild(tr);
      });

      tbl.appendChild(tbody);
      const container = document.getElementById('accountsList');
      container.innerHTML = '';
      container.appendChild(tbl);
    }

    function openEditModal(account) {
      document.getElementById('modal_username').value = account.username || '';
      document.getElementById('modal_email').value = account.email || '';
      document.getElementById('modal_currentChapter').value = account.currentChapter || 1;
      // gold and per-chapter currencies
      try {
        const ch = account.chapters || {};
        const gold = (ch[1] && ch[1].inventory && ch[1].inventory.gold) || 0;
        document.getElementById('modal_gold').value = gold;
        // build currency object
        const currencies = {};
        Object.keys(ch).forEach(k => {
          const inv = ch[k].inventory || {};
          // collect named currencies (non-gold)
          Object.keys(inv).forEach(field => {
            if (field !== 'gold' && field !== 'unlockedParameters' && field !== 'unlockedAbilities') {
              currencies[`${k}_${field}`] = inv[field];
            }
          });
        });
        document.getElementById('modal_currency').value = JSON.stringify(currencies, null, 2);
      } catch(e) { document.getElementById('modal_currency').value = '{}'; }
      document.getElementById('editModal').style.display = 'flex';
    }

    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('editModal').style.display = 'none';
      setMsg('modalMsg','');
    });

    document.getElementById('modalSave').addEventListener('click', async () => {
      const username = document.getElementById('modal_username').value;
      const email = document.getElementById('modal_email').value;
      const currentChapter = Number(document.getElementById('modal_currentChapter').value) || 1;
      const gold = Number(document.getElementById('modal_gold').value) || 0;
      let currencies = {};
      try { currencies = JSON.parse(document.getElementById('modal_currency').value); } catch (e) { setMsg('modalMsg','Invalid currency JSON'); return; }

      // Build updates object: set email, currentChapter, and per-chapter inventory currencies
      const updates = {};
      updates.email = email;
      updates.currentChapter = currentChapter;

      // patch chapters.inventory fields using dot notation
      const chapterSets = {};
      chapterSets['chapters.1.inventory.gold'] = gold;
      Object.keys(currencies).forEach(key => {
        const [chId, field] = key.split('_');
        if (!chId || !field) return;
        chapterSets[`chapters.${chId}.inventory.${field}`] = currencies[key];
      });

      // Build final update using $set
      const finalUpdate = { $set: Object.assign({}, updates, chapterSets) };

      try {
        const res = await apiFetch('/api/admin/update-account', { method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ username, updates: finalUpdate.$set }) });
        const data = await res.json();
        setMsg('modalMsg','Saved');
        document.getElementById('editModal').style.display = 'none';
      } catch (e) {
        setMsg('modalMsg','Error: '+e.message);
      }
    });
  </script>
</body>
</html>
