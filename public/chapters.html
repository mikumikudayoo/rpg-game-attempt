<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapters – Internet Explorers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: linear-gradient(135deg, #0b1623 0%, #0f1c2c 40%, #0a0f1c 100%);
            --card: rgba(15, 25, 40, 0.85);
            --accent: #f59e0b;
        }
        * { font-family: 'Space Grotesk', system-ui, sans-serif; }
        body { background: var(--bg); color: #e5e7eb; min-height: 100vh; }
        .glass { background: var(--card); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 25px 80px rgba(0,0,0,0.35); }
        .grid-lines {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }
        .blob {
            position: fixed;
            width: 360px;
            height: 360px;
            border-radius: 9999px;
            filter: blur(110px);
            opacity: 0.4;
            z-index: 0;
        }
        .blob.orange { background: #f59e0b; top: 10%; left: 4%; }
        .blob.blue { background: #22d3ee; bottom: 8%; right: 6%; }
        .chapter-card {
            transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
        }
        .chapter-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-color: rgba(245, 158, 11, 0.5);
        }
        .chapter-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .chapter-card.locked:hover {
            transform: none;
            box-shadow: none;
            border-color: rgba(255,255,255,0.08);
        }
        .chapter-number {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn { transition: transform 150ms ease, box-shadow 150ms ease; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,0.35); }
        
        /* Chapter preview image */
        .chapter-card {
            position: relative;
            overflow: hidden;
        }
        .chapter-preview {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 300ms ease;
            z-index: 0;
        }
        .chapter-preview::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(15, 25, 40, 0.98) 0%, rgba(15, 25, 40, 0.85) 40%, rgba(15, 25, 40, 0.7) 100%);
        }
        .chapter-card:hover .chapter-preview {
            opacity: 1;
        }
        .chapter-card .card-content {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

        function renderChapters() {
            const grid = document.getElementById('chapters-grid');
            grid.innerHTML = '';

            chapters.forEach(chapter => {
                const card = document.createElement('a');
                card.href = chapter.unlocked ? `/combat?ch=${chapter.id}` : '#';
                card.className = `chapter-card glass rounded-2xl p-6 border border-white/10 block ${chapter.locked ? 'locked' : ''}`;
                
                if (!chapter.unlocked) {
                    card.onclick = (e) => e.preventDefault();
                }

                const statusBadge = chapter.completed 
                    ? '<span class="bg-emerald-500/20 text-emerald-400 text-[10px] uppercase tracking-wider px-2 py-1 rounded-full border border-emerald-500/30">Completed</span>'
                    : chapter.unlocked 
                        ? '<span class="bg-amber-500/20 text-amber-400 text-[10px] uppercase tracking-wider px-2 py-1 rounded-full border border-amber-500/30">Available</span>'
                        : '<span class="bg-slate-500/20 text-slate-400 text-[10px] uppercase tracking-wider px-2 py-1 rounded-full border border-slate-500/30">🔒 Locked</span>';

                card.innerHTML = `
                    <div class="chapter-preview" style="background-image: url('${chapter.image}')"></div>
                    <div class="card-content">
                        <div class="flex items-start justify-between mb-4">
                            <div class="chapter-number text-5xl font-black">${String(chapter.id).padStart(2, '0')}</div>
                            ${statusBadge}
                        </div>
                        <h2 class="text-xl font-semibold text-white mb-1">${chapter.title}</h2>
                        <p class="text-slate-400 text-sm">${chapter.subtitle}</p>
                        ${chapter.unlocked ? `
                            <div class="mt-4 pt-4 border-t border-white/10 flex items-center justify-between">
                                <span class="text-xs text-slate-500 uppercase tracking-wider">Click to Play</span>
                                <span class="text-amber-400 text-lg">→</span>
                            </div>
                        ` : `
                            <div class="mt-4 pt-4 border-t border-white/10">
                            <span class="text-xs text-slate-500">Complete previous chapter to unlock</span>
                        </div>
                    `}
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // TODO: Fetch unlocked chapters from server based on user progress
        // async function fetchProgress() {
        //     const res = await fetch('/api/getProgress');
        //     const data = await res.json();
        //     // Update chapters array with unlocked/completed status
        // }

        renderChapters();
    </script>
