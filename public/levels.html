<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Select – Fandom Adventurers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: linear-gradient(135deg, #0b1623 0%, #0f1c2c 40%, #0a0f1c 100%);
            --card: rgba(15, 25, 40, 0.85);
            --accent: #f59e0b;
        }
        * { font-family: 'Space Grotesk', system-ui, sans-serif; }
        body { background: var(--bg); color: #e5e7eb; min-height: 100vh; }
        .glass { background: var(--card); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 25px 80px rgba(0,0,0,0.35); }
        .grid-lines {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }
        .blob {
            position: fixed;
            width: 360px;
            height: 360px;
            border-radius: 9999px;
            filter: blur(110px);
            opacity: 0.4;
            z-index: 0;
        }
        .blob.orange { background: #f59e0b; top: 10%; left: 4%; }
        .blob.blue { background: #22d3ee; bottom: 8%; right: 6%; }
        .level-card {
            transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
            cursor: pointer;
        }
        .level-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-color: rgba(245, 158, 11, 0.5);
        }
        .level-number {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .back-btn {
            transition: all 200ms ease;
        }
        .back-btn:hover {
            background: rgba(245, 158, 11, 0.2);
            border-color: rgba(245, 158, 11, 0.5);
        }
    </style>
</head>
<body>
    <div class="grid-lines"></div>
    <div class="blob orange"></div>
    <div class="blob blue"></div>

    <div class="relative z-10">
        <header class="max-w-6xl mx-auto px-6 pt-10 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/" class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-xl bg-amber-500 flex items-center justify-center text-slate-900 font-black text-xl shadow-lg">FA</div>
                    <div>
                        <div class="text-sm uppercase tracking-[0.3em] text-amber-300">Fandom Adventurers</div>
                        <div class="text-lg font-semibold text-slate-100">Level Select</div>
                    </div>
                </a>
            </div>
            <nav class="flex items-center gap-4">
                <a href="/chapters" class="back-btn flex items-center gap-2 text-slate-300 hover:text-white text-sm px-4 py-2 rounded-lg border border-white/10">
                    <span>←</span> Back to Chapters
                </a>
            </nav>
        </header>

        <main class="max-w-6xl mx-auto px-6 py-12">
            <div class="text-center mb-12">
                <div class="inline-flex items-center gap-2 bg-amber-500/10 text-amber-300 px-3 py-2 rounded-full border border-amber-500/30 text-xs uppercase tracking-[0.15em] mb-4">
                    <span id="chapter-badge">CHAPTER 1</span>
                </div>
                <h1 id="chapter-title" class="text-4xl sm:text-5xl font-semibold text-white mb-4">Loading...</h1>
                <p id="chapter-subtitle" class="text-slate-400 text-lg max-w-xl mx-auto">Select a level to begin your battle.</p>
            </div>

            <div id="levels-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                <!-- Levels will be generated by JavaScript -->
            </div>
        </main>

        <footer class="max-w-6xl mx-auto px-6 py-8 text-center text-slate-500 text-sm">
            <p>© 2025 Fandom Adventurers. All rights reserved.</p>
        </footer>
    </div>

    <script>
        // Chapter data (will be updated from API)
        let chapters = {
            1: { title: "Mindustry", subtitle: "Factory Defense", levels: 10 },
            2: { title: "Item Asylum", subtitle: "Chaos Unleashed", levels: 12 },
            3: { title: "Forsaken", subtitle: "Into the Void", levels: 10 },
            4: { title: "Die of Death", subtitle: "Asymmetrical Horror Game", levels: 8 },
            5: { title: "Phasmophobia", subtitle: "Ghost Hunt", levels: 10 },
            6: { title: "Forsaken Part 2", subtitle: "Return to the Void", levels: 12 },
            7: { title: "Project Sekai", subtitle: "Virtual Stage", levels: 10 },
            8: { title: "Limbus Company", subtitle: "Dante's Descent", levels: 15 },
            9: { title: "Battle Bricks", subtitle: "Block Warfare", levels: 10 },
            10: { title: "Recapitulation", subtitle: "The Final Chapter", levels: 20 }
        };

        // Get chapter from URL
        const urlParams = new URLSearchParams(window.location.search);
        const chapterId = parseInt(urlParams.get('ch')) || 1;

        // Fetch chapter info from server (to get accurate level count from story/enemy json)
        async function fetchChapterInfo(chapterNum) {
            try {
                const res = await fetch(`/api/chapters/${chapterNum}`);
                if (res.ok) {
                    const data = await res.json();
                    chapters[chapterNum] = {
                        title: data.title,
                        subtitle: data.subtitle,
                        levels: data.levels
                    };
                    return data;
                }
            } catch (e) {
                console.warn('Could not fetch chapter info, using defaults:', e);
            }
            return chapters[chapterNum];
        }

        // Cookie utility functions
        function getCookie(name) {
            const value = document.cookie.split('; ').find(row => row.startsWith(name + '='));
            if (!value) return null;
            try {
                return JSON.parse(decodeURIComponent(value.split('=')[1]));
            } catch {
                return null;
            }
        }

        function getLoggedInUser() {
            return getCookie('user');
        }

        // Get user progress from cookie/account data
        function getUserProgress(chapterId) {
            const user = getLoggedInUser();
            if (user && user.chapters && user.chapters[String(chapterId)]) {
                const chapterData = user.chapters[String(chapterId)];
                return chapterData.levelsCompleted || 0;
            }
            return 0;
        }

        // Check if user is logged in, redirect if not
        const currentUser = getLoggedInUser();
        if (!currentUser) {
            window.location.href = '/';
        }

        async function renderLevels() {
            // Fetch chapter info from server to get accurate level count
            await fetchChapterInfo(chapterId);
            
            const chapter = chapters[chapterId];
            if (!chapter) {
                window.location.href = '/chapters';
                return;
            }

            // Update header
            document.getElementById('chapter-badge').textContent = `CHAPTER ${chapterId}`;
            document.getElementById('chapter-title').textContent = chapter.title;
            document.getElementById('chapter-subtitle').textContent = chapter.subtitle;
            document.title = `${chapter.title} - Level Select – Fandom Adventurers`;

            const grid = document.getElementById('levels-grid');
            grid.innerHTML = '';

            const completedLevel = getUserProgress(chapterId);

            for (let i = 1; i <= chapter.levels; i++) {
                const isUnlocked = i <= completedLevel + 1;
                const isCompleted = i <= completedLevel;

                // Only show unlocked levels
                if (!isUnlocked) continue;

                const card = document.createElement('div');
                card.className = 'level-card glass rounded-xl p-4 border border-white/10';
                card.onclick = () => window.location.href = `/combat?ch=${chapterId}&lvl=${i}`;

                const statusIcon = isCompleted 
                    ? '<span class="text-emerald-400">✓</span>'
                    : '<span class="text-amber-400">→</span>';

                const statusClass = isCompleted 
                    ? 'border-emerald-500/30 bg-emerald-500/10'
                    : 'border-amber-500/30 bg-amber-500/10';

                card.innerHTML = `
                    <div class="flex flex-col items-center text-center">
                        <div class="level-number text-4xl font-black mb-2">${String(i).padStart(2, '0')}</div>
                        <div class="text-xs text-slate-400 uppercase tracking-wider mb-3">Level ${i}</div>
                        <div class="w-8 h-8 rounded-full ${statusClass} flex items-center justify-center">
                            ${statusIcon}
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            }

            // If no levels are shown (shouldn't happen for unlocked chapters)
            if (grid.children.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <p class="text-slate-500">No levels available yet.</p>
                    </div>
                `;
            }
        }

        renderLevels();
    </script>
</body>
</html>
