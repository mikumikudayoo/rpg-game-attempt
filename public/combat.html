<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Explorers - Adaptive Combat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; 
            min-height: 100vh; 
            overflow-x: hidden; /* Prevent horizontal scroll */
            user-select: none;
            touch-action: pan-y; /* Allow vertical scrolling but prevent horizontal gestures */
        }
        
        /* Prevent scrolling when dragging on mobile */
        body.dragging {
            overflow: hidden;
            touch-action: none;
        }
        
        /* Card Styles */
        .unit-card { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; z-index: 10; background-color: #1e293b; 
        }
        .unit-card:hover { transform: translateY(-4px); z-index: 20; }
        .unit-card.assigned { border-color: #fbbf24 !important; box-shadow: 0 0 15px rgba(251, 191, 36, 0.3); }
        .unit-card.draggable { cursor: grab; }
        .unit-card.draggable:active { cursor: grabbing; }
        .target-hover { transform: scale(1.05); box-shadow: 0 0 20px #f97316; border-color: #f97316 !important; }

        /* Status Effects */
        .winner { box-shadow: 0 0 30px #4ade80; border-color: #4ade80 !important; transform: scale(1.1); z-index: 30; }
        .loser { opacity: 0.6; transform: scale(0.95); filter: grayscale(0.5); }
        .acting { border-color: white !important; box-shadow: 0 0 20px white; z-index: 30; }

        /* Canvas & UI */
        #arrow-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; }
        #combat-log { scrollbar-width: thin; scrollbar-color: #475569 #1e293b; }
        
        /* Floating Text Animation */
        @keyframes floatUp { 
            0% { transform: translateY(0) scale(0.5); opacity: 0; } 
            20% { transform: translateY(-10px) scale(1.2); opacity: 1; } 
            100% { transform: translateY(-50px) scale(1); opacity: 0; } 
        }
        .float-text { 
            position: absolute; 
            animation: floatUp 1.2s forwards; 
            pointer-events: none; 
            z-index: 100; /* Highest priority */
            font-weight: 900; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.9); 
            font-size: 1.5rem;
        }

        /* Modal */
        #game-over-modal { backdrop-filter: blur(5px); }

        /* Dialogue Box */
        #dialogue-box {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px; /* Slightly reduced height for mobile */
            background: rgba(15, 23, 42, 0.95); /* slate-900/95 */
            border-top: 5px solid #083344; /* sky-900 */
            padding: 20px 24px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
            z-index: 150;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        @media (min-width: 768px) {
            #dialogue-box { height: 250px; padding: 24px 32px; } /* Desktop height */
        }

        /* Control panel animation */
        #control-panel {
            transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1), opacity 220ms ease;
            will-change: transform, opacity;
        }
        /* Closed state: slightly translated right and invisible (collapsed to button) */
        #control-panel.panel-closed {
            transform: translateX(36px);
            opacity: 0;
            pointer-events: none;
        }
        /* Toggle button animation */
        #controls-toggle { transition: transform 180ms cubic-bezier(.2,.9,.2,1), box-shadow 180ms ease; }
        #controls-toggle.btn-animate { transform: scale(1.06); box-shadow: 0 12px 30px rgba(15,23,42,0.6); }

        /* Stagger card positions to reduce visual overlap between sides */
        #player-container { padding-bottom: 24px; }
        #player-container .unit-card:nth-child(odd) { margin-top: 10px; }
        #player-container .unit-card:nth-child(even) { margin-top: 32px; }
        #enemy-container { padding-bottom: 24px; }
        #enemy-container .unit-card:nth-child(odd) { margin-top: 28px; }
        #enemy-container .unit-card:nth-child(even) { margin-top: 8px; }
        #dialogue-speaker {
            color: #fbbf24; /* amber-400 */
            font-weight: 900;
            text-shadow: 1px 1px #0f172a;
        }
        #dialogue-text {
            color: #e2e8f0; /* slate-200 */
            font-size: 1.1rem; /* Smaller text on mobile */
            line-height: 1.5;
            min-height: 60px; 
        }
        @media (min-width: 768px) {
             #dialogue-text { font-size: 1.3rem; } /* Larger text on desktop */
        }
        @keyframes blink { 50% { opacity: 0; } }
        .blinking-arrow { animation: blink 1s step-start infinite; }
        /* Enemy Info Popup */
        .info-popup { position: absolute; top: 2.25rem; right: 0.5rem; background: rgba(2,6,23,0.95); border: 1px solid #334155; border-radius: 0.5rem; padding: 0.5rem 0.75rem; z-index: 30; min-width: 180px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .info-line { font-size: 0.75rem; color: #cbd5e1; }
        .info-title { font-size: 0.8rem; font-weight: 800; color: #f59e0b; }
        .info-btn { position: absolute; top: 0.25rem; right: 0.25rem; background: #0ea5e9; color: white; font-weight: 800; border-radius: 0.375rem; padding: 0.2rem 0.4rem; font-size: 0.65rem; }
        /* Ability Boxes */
        .ability-box { width: 48px; height: 48px; border: 1px solid #334155; border-radius: 0.5rem; display: inline-flex; align-items: center; justify-content: center; background: rgba(30,41,59,0.6); margin-bottom: 6px; }
        @media (min-width: 768px) {
            .ability-box { width: 56px; height: 56px; margin-bottom: 8px; }
        }

        /* Card inner content spacing so ability boxes don't overlap the bottom border */
        .card-content { padding-bottom: 0.9rem; }
        @media (min-width: 768px) { .card-content { padding-bottom: 1.1rem; } }

        /* Enemy prominent health bar */
        .enemy-hp {
            position: relative;
            width: 100%;
            height: 12px;
            min-height: 12px;
            border-radius: 9999px; /* full round */
            background: #253244; /* slightly darker for contrast */
            overflow: hidden;
            margin: 4px 0 6px 0;
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
        }
        .enemy-hp-fill {
            height: 100%;
            width: 100%;
            transition: width 300ms ease;
            background: linear-gradient(90deg, #ef4444 0%, #f97316 100%); /* visible gradient */
            box-shadow: inset 0 -2px 6px rgba(0,0,0,0.4);
        }
        .enemy-hp-text {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #e2e8f0; /* slightly brighter */
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            text-shadow: 0 1px 0 rgba(0,0,0,0.6);
            z-index: 60;
            background: rgba(2,6,23,0.4);
            padding: 0 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<canvas id="arrow-canvas"></canvas>

<!-- Game Over Modal -->
<div id="game-over-modal" class="fixed inset-0 z-[200] hidden bg-black/80 flex items-center justify-center">
    <div class="bg-slate-800 p-6 sm:p-8 rounded-2xl border-4 border-slate-600 text-center shadow-2xl max-w-sm w-full transform transition-all scale-100">
        <h2 id="modal-title" class="text-3xl sm:text-4xl font-black mb-2 text-white uppercase tracking-tighter">VICTORY</h2>
        <p id="modal-msg" class="text-slate-400 mb-6 text-sm sm:text-base">All enemies destroyed.</p>
        <button onclick="location.reload()" class="w-full py-3 sm:py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg text-lg sm:text-xl uppercase tracking-widest shadow-lg hover:shadow-blue-500/50 transition-all">
            Restart Battle
        </button>
    </div>

    <!-- controls toggle removed from modal; toggle added after main app so it is always available -->
</div>

<!-- Dialogue Box Overlay -->
<div id="dialogue-box" class="flex flex-col justify-start" onclick="nextDialogue()">
    <div class="text-xl sm:text-2xl mb-1 sm:mb-2 flex items-center justify-between">
        <div class="flex items-center">
            <span id="dialogue-speaker" class="mr-3">sigma</span>
            <span class="text-[10px] sm:text-xs text-slate-500 uppercase tracking-widest">-- Click to Advance --</span>
        </div>
        <div class="flex gap-2" onclick="event.stopPropagation()">
            <button onclick="toggleAutoPlay()" id="btn-auto" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 text-slate-300 text-[10px] sm:text-xs font-bold rounded uppercase tracking-wider transition-all" title="Auto-play dialogue">
                AUTO
            </button>
            <button onclick="skipDialogue()" class="px-2 py-1 bg-slate-700 hover:bg-red-600 text-slate-300 hover:text-white text-[10px] sm:text-xs font-bold rounded uppercase tracking-wider transition-all" title="Skip all dialogue">
                SKIP
            </button>
        </div>
    </div>
    <div id="dialogue-text" class="text-slate-200">
        sigma sigma boy sigma boy sigma boy.
    </div>
    <div class="flex justify-end mt-auto text-3xl sm:text-4xl text-amber-400 pr-4 blinking-arrow">
        ▼
    </div>
</div>
<script>
(function() {
    const box = document.getElementById('dialogue-box');
    function applyMobileOffset() {
        if (window.matchMedia('(max-width: 767px)').matches) {
            box.style.bottom = '60px'; // raise it a bit on mobile
        } else {
            box.style.bottom = '0';
        }
    }
    applyMobileOffset();
    window.addEventListener('resize', applyMobileOffset);
})();
</script>

<div id="app" class="h-screen flex flex-col relative z-0">
    <header class="bg-slate-900/80 p-3 text-center border-b border-slate-700 backdrop-blur-sm flex justify-between items-center px-4 sm:px-8 z-10 relative">
        <div>
            <h1 class="text-base sm:text-xl font-extrabold text-slate-100 tracking-tight">INTERNET EXPLORERS <span class="text-amber-500">RPG</span></h1>
            <p class="text-[8px] sm:text-xs text-slate-400 font-mono">Vs Rolling = Duel (Roll) | Vs Ignore = Trade (Guaranteed)</p>
        </div>
        <div class="text-right">
            <div id="turn-indicator" class="text-lg sm:text-2xl font-bold text-blue-400">PLANNING PHASE</div>
            <div class="text-xs text-slate-500">Turn <span id="turn-counter">1</span></div>
        </div>
    </header>

    <div class="flex-1 flex flex-row gap-4 p-4 relative">
        

        
        <!-- Main area: Players (left half) and Enemies (right half) -->
        <main class="flex-1 flex flex-row items-stretch gap-0">
            <section id="player-column" class="w-1/2 flex items-start justify-center pr-2">
                <div id="player-container" class="w-full max-w-none grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3"></div>
            </section>

            <!-- Vertical divider exactly between halves -->
            <div class="w-px bg-slate-700"></div>

            <section id="enemy-column" class="w-1/2 flex items-start justify-center pl-2">
                <div id="enemy-container" class="w-full grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
            </section>
        </main>

        <!-- Control Panel docked to the right (starts collapsed) -->
        <aside id="control-panel" class="fixed right-4 top-12 w-80 h-[80vh] flex flex-col gap-3 p-3 bg-slate-900/90 rounded-lg border border-slate-700 shadow-lg panel-closed overflow-y-auto" style="z-index:99999;">
            <div id="combat-log" class="flex-1 min-h-[80px] bg-slate-950 rounded-lg p-3 overflow-y-auto text-xs font-mono space-y-1 opacity-95">
                <div class="text-amber-400">>> Combat Logic Loaded. Assign targets.</div>
            </div>

            <!-- Parameters Section -->
            <div class="flex flex-col gap-2">
                <div class="text-xs font-black uppercase tracking-widest text-amber-300">Parameters</div>
                <div id="parameters-container" class="bg-slate-950 rounded-lg p-3 flex flex-col gap-2 max-h-[200px] overflow-y-auto">
                    <!-- Parameter items will be generated here -->
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <button id="btn-reset" onclick="resetAssignments()" class="py-2 md:py-2 w-full bg-red-600 hover:bg-red-500 text-white font-black text-xs uppercase tracking-widest rounded-lg shadow-lg border-b-4 border-red-800 active:border-b-0 active:translate-y-1 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                    <div>Reset</div>
                    <div class="text-[10px] font-normal">Clear all</div>
                </button>
                <button id="btn-turn" onclick="resolveCombat()" class="py-3 md:py-3 w-full bg-amber-600 hover:bg-amber-500 text-white font-black text-sm uppercase tracking-widest rounded-lg shadow-lg border-b-4 border-amber-800 active:border-b-0 active:translate-y-1 transition-all disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <div>Initiate Combat</div>
                    <div class="text-[10px] font-normal">Execute actions</div>
                </button>
            </div>
        </aside>
    </div>
</div>

<!-- Global controls toggle and backdrop -->
<button id="controls-toggle" style="z-index:999999;" class="fixed left-3 bottom-4 bg-amber-600 hover:bg-amber-500 text-white rounded-full w-12 h-12 flex items-center justify-center shadow-lg" onclick="toggleControlsOverlay()" aria-label="Show controls">☰</button>
<!-- backdrop removed: control panel will no longer dim the page -->

<script src="/combat.js"></script>
</body>
</html>
